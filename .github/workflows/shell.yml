name: shell

# Proves the exe on a Windows runner before anyone downloads it. Builds here face no Smart App
# Control verdict, so a failing one costs nothing but minutes. Only native changes start this:
# to test a new app folder or check on the existing exe, run it by hand with `reuse`.
on:
  workflow_dispatch:
    inputs:
      reuse:
        description: Skip the build, and use the exe from the latest build on this branch
        type: boolean
        default: false
      soak:
        description: Seconds the contract check leaves the hub hidden, to see if it gets throttled
        type: string
        default: '0'
  push:
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/shell-core/**
      - apps/desktop/packaging/**
      - apps/desktop/scripts/installer.py
      - apps/desktop/shell-check/installer-check.ps1
      - apps/desktop/shell-check/older-installer.py
      - packaging/winget/**
      - .github/workflows/shell.yml

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOAK: ${{ inputs.soak || '0' }}
      REUSE: ${{ inputs.reuse || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        if: env.REUSE != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            apps/desktop/shell-core/target
          key: shell-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            shell-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            shell-${{ runner.os }}-

      - name: Rust toolchain
        if: env.REUSE != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: cargo test
        if: env.REUSE != 'true'
        run: cargo test --locked --manifest-path apps/desktop/shell-core/Cargo.toml

      - name: Release build
        if: env.REUSE != 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --locked

      - name: Exe from this build
        if: env.REUSE != 'true'
        run: |
          New-Item -ItemType Directory -Force exe | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/desktop-buddies.exe exe/

      - name: Exe from the latest build
        if: env.REUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow shell.yml --branch $env:GITHUB_REF_NAME --status success --limit 20 --json databaseId,event --jq '[.[] | select(.event == "push")][0].databaseId'
          if (-not $run) { throw 'no earlier build on this branch' }
          "using the exe from run $run"
          gh run download $run --name desktop-buddies-windows --dir exe

      - name: About the exe
        run: |
          $f = Get-Item exe/desktop-buddies.exe
          $line = "$($f.Name) $($f.Length) bytes sha256 $((Get-FileHash $f -Algorithm SHA256).Hash)"
          $line
          "$line`n" >> $env:GITHUB_STEP_SUMMARY

      # On every run, reused or not: the installer job takes it from here.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-buddies-windows
          path: exe/desktop-buddies.exe
          retention-days: 30
          if-no-files-found: error

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddies/desktop build

      - uses: actions/upload-artifact@v4
        with:
          name: app-folder
          path: apps/desktop/dist/app
          retention-days: 14
          if-no-files-found: error

      - name: Contract check
        shell: pwsh
        run: apps/desktop/shell-check/driver.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/shell-check -Out results -Soak $env:SOAK

      - name: Smoke run
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/smoke.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      - name: Local API end to end
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/api-e2e.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      # Fails on uneven frames only where the runner's display is steady enough to judge; else it reports.
      - name: Frame pacing
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/pacing.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      # The Store's MSIX from this run's exe and app folder, with a test identity, signed with a
      # throwaway certificate, installed, checked through its alias, and uninstalled.
      - name: Store package
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/store-package.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-results
          path: results
          retention-days: 14
          if-no-files-found: warn

  # The per-user installer, in a job of its own with its own time, on the build job's exe and app
  # folder: built as the release builds it, an upgrade from a lower version run over it, then winget's
  # check of its manifests.
  installer:
    needs: windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAURI_CLI: 2.12.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-buddies-windows
          path: exe

      - uses: actions/download-artifact@v4
        with:
          name: app-folder
          path: apps/desktop/dist/app

      # tauri-cli at the release's version, built once and kept by that version.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ env.TAURI_CLI }}

      - name: tauri-cli
        run: |
          if (-not (Test-Path ~/.cargo/bin/cargo-tauri.exe)) { cargo install tauri-cli --version $env:TAURI_CLI --locked; if ($LASTEXITCODE) { throw 'installing tauri-cli failed' } }
          $said = cargo-tauri --version
          if ($said -ne "tauri-cli $env:TAURI_CLI") { throw "cargo-tauri says '$said', not tauri-cli $env:TAURI_CLI" }
          $said

      # The zip, then the installer from the zip, with a stand-in for the crates' notices, which only
      # the release writes. The older build is the same files at a lower version.
      - name: Installer
        shell: pwsh
        run: |
          $v = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $old = '0.0.1'
          'Third-party notices: a stand-in. The release build writes the real ones.' | Set-Content notices.txt
          python -I apps/desktop/scripts/preview.py --release $v --exe exe/desktop-buddies.exe --notices notices.txt --out-dir installer
          if ($LASTEXITCODE) { throw 'packing the zip failed' }
          python -I apps/desktop/scripts/installer.py --release $v --zip installer/desktop-buddies-$v-windows-x64.zip --out-dir installer
          if ($LASTEXITCODE) { throw 'building the installer failed' }
          python -I apps/desktop/shell-check/older-installer.py --zip installer/desktop-buddies-$v-windows-x64.zip --old-version $old --out-dir installer-old
          if ($LASTEXITCODE) { throw 'building the older installer failed' }
          apps/desktop/shell-check/installer-check.ps1 -Setup installer/desktop-buddies-$v-setup-x64.exe -OldSetup installer-old/desktop-buddies-$old-setup-x64.exe -OldVersion $old -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Version $v -Out results

      # winget's own check of the manifests, written for the installer just built. A runner image with
      # no winget says so in a warning and the summary: then the schema tests in tools/release are all.
      - name: winget validate
        if: success() || failure()
        shell: pwsh
        run: |
          $v = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setup = "installer/desktop-buddies-$v-setup-x64.exe"
          if (-not (Test-Path $setup)) { throw 'no installer to write the manifests for' }
          python -I packaging/winget/manifest.py --version $v --sha256 (Get-FileHash $setup -Algorithm SHA256).Hash --out winget-manifests
          if ($LASTEXITCODE) { throw 'writing the manifests failed' }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe -ErrorAction SilentlyContinue
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            "::warning::winget isn't on this runner, so winget validate didn't run"
            "winget validate: not run, there's no winget on this runner`n" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "winget $(winget --version)"
          $said = winget validate --manifest winget-manifests 2>&1 | Out-String
          $said
          # warnings alone end it with a code of their own, after saying it succeeded
          if ($LASTEXITCODE -and $said -notmatch 'validation succeeded') { throw "winget validate failed, code $LASTEXITCODE" }
          "winget validate: passed`n" >> $env:GITHUB_STEP_SUMMARY
          # The runner ends a PowerShell step with the last native command's code, and winget's
          # code for "succeeded with warnings" isn't 0, so a pass has to end the step itself.
          exit 0

      # Once a release's manifests are committed, install that published release through them the way
      # `winget install` will, then uninstall it. Skipped until they exist for package.json's version.
      - name: winget install from the committed manifest
        id: winget_install
        if: success() || failure()
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifests = "packaging/winget/manifests/e/exvanitas/DesktopBuddies/$version"
          if (-not (Test-Path $manifests)) {
            "winget install: no committed manifests for $version yet`n" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe -ErrorAction SilentlyContinue
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw "no winget on this runner" }
          "winget $(winget --version)"
          winget settings --enable LocalManifestFiles | Out-Host
          winget install --manifest $manifests --silent --accept-package-agreements --accept-source-agreements --disable-interactivity | Out-Host
          if ($LASTEXITCODE) { throw "winget install failed, code $LASTEXITCODE" }
          $installed = Join-Path $env:LOCALAPPDATA 'Desktop Buddies\desktop-buddies.exe'
          if (-not (Test-Path $installed)) { throw "nothing installed where the manifest says" }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Desktop Buddies' }
          if (-not $entry -or $entry.DisplayVersion -ne $version) { throw "Installed apps doesn't show Desktop Buddies $version" }
          "PASS winget.installed $version by $($entry.Publisher)"
          winget uninstall --manifest $manifests --silent --disable-interactivity | Out-Host
          for ($i = 0; $i -lt 60 -and (Test-Path $installed); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $installed) { throw "still installed after winget uninstall" }
          "PASS winget.uninstalled"
          "winget install and uninstall of $version through its manifests: passed`n" >> $env:GITHUB_STEP_SUMMARY
          exit 0

      # If that step failed or ran out of time, winget's own log says where it stopped.
      - name: winget log
        if: failure() && steps.winget_install.conclusion != 'skipped'
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
          Get-ChildItem $dir -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 |
            ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-results
          path: results
          retention-days: 14
          if-no-files-found: warn
