name: shell

# Proves the exe on a Windows runner before anyone downloads it. Builds here face no Smart App
# Control verdict, so a failing one costs nothing but minutes. Only native changes start this:
# to test a new app folder or check on the existing exe, run it by hand with `reuse`.
on:
  workflow_dispatch:
    inputs:
      reuse:
        description: Skip the build, and use the exe from the latest build on this branch
        type: boolean
        default: false
      soak:
        description: Seconds the contract check leaves the hub hidden, to see if it gets throttled
        type: string
        default: '0'
  push:
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/shell-core/**
      - apps/desktop/packaging/**
      - apps/desktop/scripts/installer.py
      - apps/desktop/scripts/installer-hooks.nsh
      - apps/desktop/shell-check/installer-check.ps1
      - packaging/winget/**
      - .github/workflows/shell.yml

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOAK: ${{ inputs.soak || '0' }}
      REUSE: ${{ inputs.reuse || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        if: env.REUSE != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            apps/desktop/shell-core/target
          key: shell-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            shell-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            shell-${{ runner.os }}-

      - name: Rust toolchain
        if: env.REUSE != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: cargo test
        if: env.REUSE != 'true'
        run: cargo test --locked --manifest-path apps/desktop/shell-core/Cargo.toml

      - name: Release build
        if: env.REUSE != 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --locked

      - name: Exe from this build
        if: env.REUSE != 'true'
        run: |
          New-Item -ItemType Directory -Force exe | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/desktop-buddies.exe exe/

      - name: Exe from the latest build
        if: env.REUSE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow shell.yml --branch $env:GITHUB_REF_NAME --status success --limit 20 --json databaseId,event --jq '[.[] | select(.event == "push")][0].databaseId'
          if (-not $run) { throw 'no earlier build on this branch' }
          "using the exe from run $run"
          gh run download $run --name desktop-buddies-windows --dir exe

      - name: About the exe
        run: |
          $f = Get-Item exe/desktop-buddies.exe
          $line = "$($f.Name) $($f.Length) bytes sha256 $((Get-FileHash $f -Algorithm SHA256).Hash)"
          $line
          "$line`n" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: env.REUSE != 'true'
        with:
          name: desktop-buddies-windows
          path: exe/desktop-buddies.exe
          retention-days: 30
          if-no-files-found: error

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buddies/desktop build

      - name: Contract check
        shell: pwsh
        run: apps/desktop/shell-check/driver.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/shell-check -Out results -Soak $env:SOAK

      - name: Smoke run
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/smoke.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      - name: Local API end to end
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/api-e2e.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      # Fails on uneven frames only where the runner's display is steady enough to judge; else it reports.
      - name: Frame pacing
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/pacing.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      # The Store's MSIX from this run's exe and app folder, with a test identity, signed with a
      # throwaway certificate, installed, checked through its alias, and uninstalled.
      - name: Store package
        if: success() || failure()
        shell: pwsh
        run: apps/desktop/shell-check/store-package.ps1 -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Out results

      # The per-user installer, built from this exe as the release builds it: the zip, then the
      # installer from the zip, with a stand-in for the crates' notices, which only the release writes.
      # An older build, the same with one more app file, is installed first, then upgraded to this one.
      - name: Installer
        if: success() || failure()
        shell: pwsh
        env:
          TAURI_CLI: 2.12.4
        run: |
          cargo install tauri-cli --version $env:TAURI_CLI --locked
          if ($LASTEXITCODE) { throw 'installing tauri-cli failed' }
          $v = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          'Third-party notices: a stand-in. The release build writes the real ones.' | Set-Content notices.txt
          python -I apps/desktop/scripts/preview.py --release $v --exe exe/desktop-buddies.exe --notices notices.txt --out-dir installer
          if ($LASTEXITCODE) { throw 'packing the zip failed' }
          python -I apps/desktop/scripts/installer.py --release $v --zip installer/desktop-buddies-$v-windows-x64.zip --out-dir installer
          if ($LASTEXITCODE) { throw 'building the installer failed' }
          New-Item -ItemType Directory -Force installer-old | Out-Null
          Copy-Item installer/desktop-buddies-$v-windows-x64.zip installer-old/old.zip
          python -I -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], 'a'); z.writestr(sys.argv[2], 'old()'); z.close()" installer-old/old.zip "Desktop Buddies $v/app/old-only.js"
          if ($LASTEXITCODE) { throw 'making the older zip failed' }
          python -I apps/desktop/scripts/installer.py --release $v --zip installer-old/old.zip --out-dir installer-old
          if ($LASTEXITCODE) { throw 'building the older installer failed' }
          apps/desktop/shell-check/installer-check.ps1 -Setup installer/desktop-buddies-$v-setup-x64.exe -OldSetup installer-old/desktop-buddies-$v-setup-x64.exe -OldOnly app\old-only.js -Exe exe/desktop-buddies.exe -App apps/desktop/dist/app -Version $v -Out results

      # winget's own check of the manifests, written for the installer just built. A runner image with
      # no winget says so in a warning and the summary: then the schema tests in tools/release are all.
      - name: winget validate
        if: success() || failure()
        shell: pwsh
        run: |
          $v = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setup = "installer/desktop-buddies-$v-setup-x64.exe"
          if (-not (Test-Path $setup)) { throw 'no installer to write the manifests for' }
          python -I packaging/winget/manifest.py --version $v --sha256 (Get-FileHash $setup -Algorithm SHA256).Hash --out winget-manifests
          if ($LASTEXITCODE) { throw 'writing the manifests failed' }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Add-AppxPackage -RegisterByFamilyName -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe -ErrorAction SilentlyContinue
          }
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            "::warning::winget isn't on this runner, so winget validate didn't run"
            "winget validate: not run, there's no winget on this runner`n" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "winget $(winget --version)"
          $said = winget validate --manifest winget-manifests 2>&1 | Out-String
          $said
          # warnings alone end it with a code of their own, after saying it succeeded
          if ($LASTEXITCODE -and $said -notmatch 'validation succeeded') { throw "winget validate failed, code $LASTEXITCODE" }
          "winget validate: passed`n" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-results
          path: results
          retention-days: 14
          if-no-files-found: warn
